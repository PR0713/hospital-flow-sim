[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-sim"
version = "0.1.0"
description = "Discrete-event hospital patient-flow scheduling simulator with an RL-facing environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = [
    "matplotlib>=3.8",
    "scipy-stubs",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run skips tests marked slow and takes under a minute.
# Run everything with:  pytest -m ""
addopts = "-q -m 'not slow'"
markers = [
    "slow: long statistical, end-to-end or benchmark tests; run with -m \"\" before a milestone commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
