# The surgical day unit of example_hospital.yaml with the realism layer on:
# six hours of time-varying elective arrivals plus an urgent stream,
# correlated durations within a patient, a visible acuity class, heavy-tailed
# surgery, surgeons of different speed, nurse rosters with breaks and absences,
# a scanner that can break down, and operating-room turnover. All numbers are
# illustrative.
name: example_hospital_dynamic
time_unit: minute

roles:
  - {name: Nurse, kind: staff}
  - {name: LabTechnician, kind: staff}
  - {name: Radiographer, kind: staff}
  - {name: LeadSurgeon, kind: staff}
  - {name: AssistantSurgeon, kind: staff}
  - {name: Anaesthetist, kind: staff}
  - {name: OperatingRoom, kind: room}
  - {name: RecoveryRoom, kind: room}
  - {name: ScanRoom, kind: room}
  - {name: LabAnalyzer, kind: equipment}

calendars:
  # Two nurse rosters on a 12-hour day, with staggered 30-minute breaks.
  # Work not finished by minute 720 waits for the next day.
  - name: nurses_early_break
    period: 1440
    shifts: [{start: 0, end: 720}]
    breaks: [{start: 240, duration: 30}]
    absence_probability: 0.05
  - name: nurses_late_break
    period: 1440
    shifts: [{start: 0, end: 720}]
    breaks: [{start: 300, duration: 30}]
    absence_probability: 0.05

resources:
  - {roles: [Nurse], id: nurse_a, count: 3, calendar: nurses_early_break}
  - {roles: [Nurse], id: nurse_b, count: 3, calendar: nurses_late_break}
  - {roles: [LabTechnician], id: labtech, count: 2}
  - {roles: [Radiographer], count: 1}
  # The seniors operate 20% faster than the reference; the junior 15% slower.
  - {id: surgeon_senior, roles: [LeadSurgeon, AssistantSurgeon], count: 2, attributes: {speed: 1.2}}
  - {id: surgeon_junior, roles: [LeadSurgeon, AssistantSurgeon], attributes: {speed: 0.85}}
  - {roles: [Anaesthetist], count: 2}
  - {roles: [OperatingRoom], id: or, count: 2}
  - {roles: [RecoveryRoom], id: recovery_bay, count: 3}
  - {roles: [ScanRoom], id: scan_room, count: 1, breakdown: {mtbf: 2000, mttr: 45}}
  - {roles: [LabAnalyzer], id: analyzer, count: 2}

operation_types:
  - name: BloodDraw
    requirements: [{role: Nurse}]
    duration: {mean: 10, cv: 0.3}
  - name: LabAnalysis
    requirements: [{role: LabTechnician}, {role: LabAnalyzer}]
    duration: {mean: 30, cv: 0.4}
    requires_patient: false
  - name: ResultTurnaround          # pure delay: validation and reporting
    duration: {mean: 15, cv: 0.5}
    requires_patient: false
  - name: XRay
    requirements: [{role: ScanRoom}, {role: Radiographer}]
    duration: {mean: 15, cv: 0.3}
  - name: CTScan
    requirements: [{role: ScanRoom}, {role: Radiographer}]
    duration: {mean: 30, cv: 0.4}
  - name: AnaestheticReview
    requirements: [{role: Anaesthetist}]
    duration: {mean: 15, cv: 0.3}
  - name: PreOpPrep
    requirements: [{role: Nurse}]
    duration: {mean: 20, cv: 0.3}
  - name: Surgery
    requirements:
      - {role: OperatingRoom}
      - {role: LeadSurgeon}
      - {role: AssistantSurgeon}
      - {role: Anaesthetist}
      - {role: Nurse, quantity: 2}
    # Never under 30 minutes; 8% of cases hit a complication and take 2.5x.
    duration: {mean: 80, cv: 0.4, shift: 30, complication: {probability: 0.08, multiplier: 2.5}}
    speed_roles: [LeadSurgeon]
    turnover: {OperatingRoom: 15}    # cleaning before the next case
  - name: Recovery
    requirements: [{role: RecoveryRoom}, {role: Nurse}]
    duration: {distribution: gamma, mean: 60, cv: 0.3}

pathways:
  - name: surgical
    steps:
      - {id: blood_draw, op_type: BloodDraw}
      - {id: lab, op_type: LabAnalysis, after: [blood_draw]}
      - {id: result, op_type: ResultTurnaround, after: [lab]}
      - {id: xray, op_type: XRay, branch_group: imaging, branch_weight: 0.7}
      - {id: ct, op_type: CTScan, branch_group: imaging, branch_weight: 0.3}
      - {id: anaesthetic_review, op_type: AnaestheticReview, after: [result], probability: 0.6}
      - {id: pre_op, op_type: PreOpPrep, after: [anaesthetic_review, xray, ct]}
      - {id: surgery, op_type: Surgery, after: [pre_op]}
      - {id: recovery, op_type: Recovery, after: [surgery]}
  - name: diagnostic
    steps:
      - {id: blood_draw, op_type: BloodDraw}
      - {id: lab, op_type: LabAnalysis, after: [blood_draw]}
      - {id: result, op_type: ResultTurnaround, after: [lab]}
      - {id: xray, op_type: XRay}
      - {id: ct, op_type: CTScan, after: [xray], probability: 0.25}
  - name: emergency_surgery
    steps:
      - {id: ct, op_type: CTScan}
      - {id: pre_op, op_type: PreOpPrep, after: [ct]}
      - {id: surgery, op_type: Surgery, after: [pre_op]}
      - {id: recovery, op_type: Recovery, after: [surgery]}

arrivals:
  - name: elective
    kind: poisson
    horizon: 360                    # arrivals stop after 6 hours, then drain
    # Patients per minute for each of the 6 hours: a morning peak, then tapering.
    rate_profile: {period: 360, rates: [0.04, 0.035, 0.03, 0.02, 0.015, 0.01]}
    batch_mean: 1.5                 # arrivals come in small clumps
    pathway_mix: {surgical: 0.4, diagnostic: 0.6}
  - name: urgent
    kind: poisson
    horizon: 360
    rate: 0.003                     # about one per day
    weight: 5.0
    urgent: true
    pathway_mix: {emergency_surgery: 1.0}

complexity:
  rho: 0.4                          # complex patients are slow at everything
  acuity_classes: 3                 # visible at arrival
  acuity_correlation: 0.7           # ...but only a noisy reading of the truth
