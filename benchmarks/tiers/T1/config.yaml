# Benchmark tier T1 (hospital_sim v0.1): static batch, single-skill resources,
# low duration variance, no rosters or breakdowns.
# Derived from configs/example_hospital.yaml: every resource holds one role
# (two lead surgeons, one assistant: the same headcount and the same single
# concurrent surgery as the original), every duration lognormal with cv 0.1.
# Frozen for v0.1: do not edit; add a new tier instead. Numbers are illustrative.
name: T1
time_unit: minute

roles:
  - {name: Nurse, kind: staff}
  - {name: LabTechnician, kind: staff}
  - {name: Radiographer, kind: staff}
  - {name: LeadSurgeon, kind: staff}
  - {name: AssistantSurgeon, kind: staff}
  - {name: Anaesthetist, kind: staff}
  - {name: OperatingRoom, kind: room}
  - {name: RecoveryRoom, kind: room}
  - {name: ScanRoom, kind: room}
  - {name: LabAnalyzer, kind: equipment}

resources:
  - {roles: [Nurse], count: 6}
  - {roles: [LabTechnician], id: labtech, count: 2}
  - {roles: [Radiographer], count: 1}
  - {roles: [LeadSurgeon], id: surgeon_lead, count: 2}
  - {roles: [AssistantSurgeon], id: surgeon_assistant, count: 1}
  - {roles: [Anaesthetist], count: 2}
  - {roles: [OperatingRoom], id: or, count: 2}
  - {roles: [RecoveryRoom], id: recovery_bay, count: 3}
  - {roles: [ScanRoom], id: scan_room, count: 1}
  - {roles: [LabAnalyzer], id: analyzer, count: 2}

operation_types:
  - {name: BloodDraw, requirements: [{role: Nurse}], duration: {mean: 10, cv: 0.1}}
  - name: LabAnalysis
    requirements: [{role: LabTechnician}, {role: LabAnalyzer}]
    duration: {mean: 30, cv: 0.1}
    requires_patient: false
  - {name: XRay, requirements: [{role: ScanRoom}, {role: Radiographer}], duration: {mean: 15, cv: 0.1}}
  - {name: CTScan, requirements: [{role: ScanRoom}, {role: Radiographer}], duration: {mean: 30, cv: 0.1}}
  - {name: AnaestheticReview, requirements: [{role: Anaesthetist}], duration: {mean: 15, cv: 0.1}}
  - {name: PreOpPrep, requirements: [{role: Nurse}], duration: {mean: 20, cv: 0.1}}
  - name: Surgery
    requirements:
      - {role: OperatingRoom}
      - {role: LeadSurgeon}
      - {role: AssistantSurgeon}
      - {role: Anaesthetist}
      - {role: Nurse, quantity: 2}
    duration: {mean: 90, cv: 0.1}
  - {name: Recovery, requirements: [{role: RecoveryRoom}, {role: Nurse}], duration: {mean: 60, cv: 0.1}}

pathways:
  - name: surgical
    steps:
      - {id: blood_draw, op_type: BloodDraw}
      - {id: lab, op_type: LabAnalysis, after: [blood_draw]}
      - {id: xray, op_type: XRay, branch_group: imaging, branch_weight: 0.7}
      - {id: ct, op_type: CTScan, branch_group: imaging, branch_weight: 0.3}
      - {id: anaesthetic_review, op_type: AnaestheticReview, after: [lab], probability: 0.6}
      - {id: pre_op, op_type: PreOpPrep, after: [anaesthetic_review, xray, ct]}
      - {id: surgery, op_type: Surgery, after: [pre_op]}
      - {id: recovery, op_type: Recovery, after: [surgery]}
  - name: diagnostic
    steps:
      - {id: blood_draw, op_type: BloodDraw}
      - {id: lab, op_type: LabAnalysis, after: [blood_draw]}
      - {id: xray, op_type: XRay}
      - {id: ct, op_type: CTScan, after: [xray], probability: 0.25}

arrivals:
  kind: static
  n_patients: 10
  pathway_mix: {surgical: 0.6, diagnostic: 0.4}
